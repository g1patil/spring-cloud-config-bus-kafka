spring.application.name=cloud-config-client
server.port=8080
info.app.name=cloud-config-client

# Kafka
kafka.broker.list=localhost



# Default Spring Cloud Stream configurations
spring.cloud.stream.kafka.binder.brokers=${kafka.broker.list}
spring.cloud.stream.kafka.binder.configuration.security.protocol=PLAINTEXT
spring.cloud.stream.default.contentType=application/json

# Spring Cloud Config Server
spring.cloud.bus.ack.enabled=true
spring.cloud.bus.enabled=true
spring.cloud.bus.destination=ConfigurationUpdated
spring.cloud.bus.refresh.enabled=true


# Avoid setting default.group — it applies to all bindings and causes Kafka to deliver each bus event
# to only one instance in the group, breaking refresh on scaled deployments.
# spring.cloud.stream.default.group=WILL-FAIL-AUTO-SCALING

# Pin the bus input to a per-instance group using the auto-generated bus ID (appName:port:randomUUID).
# This overrides any default.group and ensures every instance gets its own group, so all nodes refresh.
# Do not hardcode spring.cloud.bus.id — Spring auto-generates a unique value per startup if left unset.
spring.cloud.stream.bindings.springCloudBusInput.group=${spring.cloud.bus.id}
# Actuator
management.endpoints.web.exposure.include=health,info,metrics,bindings,mappings,loggers,configprops,busrefresh,env
management.info.env.enabled=true
management.info.java.enabled=true
management.info.build.enabled=true

spring.config.import=optional:configserver:localhost:8081